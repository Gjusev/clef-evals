name: "clef-evals regression gate"
description: >-
  Fail the build when accuracy or calibration regresses: compare a fresh
  measurement JSON against a committed baseline. Pure Python, no Clef
  credentials needed at gate time (the measurement itself is produced by
  your own run step, typically evals/run_eval.py).
inputs:
  current:
    description: "Path to the fresh measurement JSON"
    required: true
  baseline:
    description: "Path to the committed baseline JSON"
    required: true
  metrics:
    description: >-
      Metric specs, one per line: path:goal[:tolerance] — path is a dotted
      path into the JSON, goal is min (accuracy-like, may not drop) or max
      (ECE-like, may not grow), and tolerance defaults to 0.02.
    required: true
outputs:
  passed:
    description: "Whether the gate passed ('true' or 'false')"
    value: ${{ steps.gate.outputs.passed }}
runs:
  using: "composite"
  steps:
    - name: Check accuracy and calibration against the baseline
      id: gate
      shell: bash
      env:
        METRICS: ${{ inputs.metrics }}
        CURRENT: ${{ inputs.current }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        ARGS=()
        while IFS= read -r spec; do
          spec="${spec%$'\r'}"   # tolerate CRLF from workflow editors
          [ -n "$spec" ] && ARGS+=(--metric "$spec")
        done <<< "$METRICS"
        if python3 "${{ github.action_path }}/../../../scripts/check_regression.py" \
          --current "$CURRENT" \
          --baseline "$BASELINE" \
          "${ARGS[@]}"; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
